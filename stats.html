第 1 週", "c": "Sunday mixed set", "h": "Week-01-notes.html#sunday-mixed-set-M5", "l": "第 1 週 · Sunday mixed set · M5"}, {"id": "Week-01-notes.html|sunday-mixed-set-M6", "k": "q", "w": "第 1 週", "c": "Sunday mixed set", "h": "Week-01-notes.html#sunday-mixed-set-M6", "l": "第 1 週 · Sunday mixed set · M6"}, {"id": "Week-01-notes.html|friday-expression-answers", "k": "p", "w": "第 1 週", "c": "練習", "h": "Week-01-notes.html#a-valid-main", "l": "第 1 週 · A valid main The program starts at: public static void main(String[] args) {} These also work: static public void main(String[] args) {} public static void main(String... args) {} public static void main(String args[]) {} public and static may be swapped. The parameter may be a String array or String varargs. The name is main , the return type is void . Anything else ( Main , a return of int , a parameter of int[] ) compiles as an ordinary method and is not the entry point. On Java 21 the exam still uses this classic main . Monday lab — JDK, IntelliJ, one line from main Open a new terminal and run java -version . The first line should contain 21 . PowerShell often shows that line in red because Java writes it to the error stream. The version text is the result. Install IntelliJ IDEA Community if it is not installed yet. In the new project dialog, set the JDK to 21 and the folder C:\\Program Files\\Java\\jdk-21 . Type this class. The printed line is your name. public class Hello { public static void main(String[] args) { System.out.println(\"Your Name\"); } } Run it from IntelliJ. Then answer Chapter 1 question Q7. That is Monday’s question time. Wednesday — eight primitives, literals, and var Close this file and write the eight primitives, their sizes, and their default field values from memory. Then check the table. After the table, read literals and var , and type every listing. Wrappers are the same day’s reading: the week’s exam topic is numeric types, and the Chapter 1 questions use them. End Wednesday with Chapter 1 questions Q1–Q6 and Q8 (40 minutes). Each miss goes in the notebook. The eight primitives Type Size Default on a field Range to remember byte 8-bit 0 -128 to 127 short 16-bit 0 -32,768 to 32,767 int 32-bit 0 about ±2.1 billion long 64-bit 0 needs an L suffix on big literals float 32-bit 0.0f literal needs f double 64-bit 0.0 default for 1.0 char 16-bit unsigned '\\u0000' 0 to 65,535 boolean — false only true or false Fields (instance or static ) get those defaults. Local variables do not. Reading a local variable before it has been assigned is a compile error. public class Defaults { static int count; // 0 static boolean ready; // false static String name; // null, a reference, not a primitive public static void main(String[] args) { int local; // System.out.println(local); // does not compile local = 1; System.out.println(local); // 1 } } String is a class. Its default on a field is null . A local String still must be assigned before you read it. Literals int n = 1_000_000; // underscores sit between digits long big = 3_000_000_000L; float f = 1.0f; double d = 1.0; // 1.0 is a double char c = 'A'; char c2 = 65; // 65 fits in a char, so this compiles boolean b = true; int hex = 0x1F; // 31 int bin = 0b1010; // 10 int oct = 011; // octal: 9, not 11 Rules the exam uses: 1.0 is a double . float f = 1.0; does not compile. float f = 1; does, because an int widens to float . A whole number is an int . long x = 3000000000; does not compile. Write 3000000000L . byte b = 128; does not compile. 128 does not fit. byte b = 127; does. char c = -1; does not compile. A char cannot be negative. char c = (char) -1; compiles. A leading zero means octal. 011 is 9. 018 does not compile, because 8 is not an octal digit. Underscores must sit between digits. _1 , 1_ , 1_.0 , and 1_L do not compile. 1_000 and 1__000 do. var is for local variables only var count = 1; // int var price = 1.0; // double var name = \"ocp\"; // String var nums = new int[] {1, 2}; // int[] These do not compile: var x; // no initializer, so no type to infer var y = null; // null has no type var z = {1, 2}; // an array initializer needs a type on the left, or new var a = 1, b = 2; // only one variable var cannot be a field, a parameter, or a return type. var is a type name, so int var = 1; is legal. var n = (String) null; compiles, because the cast tells the compiler the type. Scope A local variable lives from its declaration to the end of the block. A nested block cannot declare the same name again. public static void main(String[] args) { int x = 1; { // int x = 2; // does not compile: x is already in scope int y = 2; } // y is gone here int y = 3; // legal, the previous y is out of scope } Wrapper classes Each primitive has a class: Byte , Short , Integer , Long , Float , Double , Character , Boolean . Assigning a primitive to a wrapper is boxing . The other direction is unboxing . Integer count = 10; // boxing int n = count; // unboxing On Java 21 the constructors are gone. new Integer(1) does not compile. Use assignment or Integer.valueOf(1) . Integer.parseInt(\"10\") returns an int and throws NumberFormatException on \"ten\" . Integer.valueOf(\"10\") returns an Integer . Unboxing null throws NullPointerException : Integer empty = null; int n = empty; // NullPointerException Integer.valueOf caches -128 to 127 . == on two wrappers compares references. Inside the cache they are often the same object. Outside it, two equal values can be different objects. Use equals to compare values. Integer a = 127; Integer b = 127; System.out.println(a == b); // true, cached Integer c = 128; Integer d = 128; System.out.println(c == d); // false, different objects System.out.println(c.equals(d)); // true Integer e = 1000; int f = 1000; System.out.println(e == f); // true, the wrapper is unboxed Byte , Short , and Long use the same -128 to 127 cache. Character caches 0 to 127. Float and Double do not cache, so == on two Float objects is a reference check even for small values. Chapter 1 questions Q1. What is the output? public class Q1 { static int count; static boolean ready; public static void main(String[] args) { System.out.print(count); System.out.print(ready); } } A 0false B 0true C The code does not compile D A NullPointerException is thrown 揭曉答案 答案：A。 A missing int field is 0 . A missing boolean field is false . Printing them produces 0false with no space. Q2. Which of the following compile? (Choose all that apply.) byte a = 127; byte b = 128; long c = 3_000_000_000; long d = 3_000_000_000L; float e = 1.0; char f = 65; int g = 018; int h = 011; A a B b C c D d E e F f G g H h 揭曉答案 答案：A、D、F、H。 127 fits in a byte . 128 does not. 3_000_000_000 is an int literal that is too big; the L makes it a long . 1.0 is a double and does not fit in a float variable without a cast or an f . 65 fits in a char . 018 is illegal octal. 011 is octal for 9, and it compiles. Q3. What is the result? public class Q3 { public static void main(String[] args) { int local; System.out.println(local); } } A 0 B null C The code does not compile D A NullPointerException is thrown 揭曉答案 答案：C。 local is a local variable. Locals have no default. Reading it before assignment does not compile. The same name as a field would have printed 0 . Q4. Which lines compile? (Choose all that apply.) var a = 10; var b = null; var c = (String) null; var d = {1, 2}; var e = new int[] {1, 2}; var f = 1, g = 2; A The line with a B The line with b C The line with c D The line with d E The line with e F The line with f and g 揭曉答案 答案：A、C、E。 var needs an initializer with a clear type. null alone has no type. A cast supplies one. {1, 2} is not a standalone expression. new int[] {1, 2} is. var declares one variable, so the comma form does not compile. Q5. What is the output? public class Q5 { public static void main(String[] args) { Integer a = 128; Integer b = 128; Integer c = 100; Integer d = 100; System.out.print(a == b); System.out.print(\" \"); System.out.print(c == d); System.out.print(\" \"); System.out.print(a.equals(b)); } } A true true true B false true true C false false true D true false true 揭曉答案 答案：B。 128 is outside the Integer cache, so a == b is false . 100 is inside -128 to 127, so c == d is true . equals compares the numeric value, so the last print is true . Q6. What is the result? public class Q6 { public static void main(String[] args) { Integer n = null; int value = n; System.out.println(value); } } A 0 B null C The code does not compile D A NullPointerException is thrown 揭曉答案 答案：D。 The assignment unboxes n . Unboxing null throws NullPointerException . The code does compile. Q7. What is the output of this legal entry-point class? If it does not run, choose the reason. public class Q7 { static public void main(String args[]) { System.out.println(\"go\"); } } A go B The code does not compile C It compiles, but there is no valid main , so it does not start D A NullPointerException is thrown 揭曉答案 答案：A。 static and public may appear in either order. String args[] is a String array. This is a valid main , and it prints go . Q8. Which snippet compiles? A { int x = 1; } int x = 2; B int x = 1; { int x = 2; } C int value = 1_000_; D Integer n = new Integer(5); 揭曉答案 答案：A。 After the inner block ends, x can be declared again. A nested block cannot reuse a name that is already in scope, so B fails. An underscore cannot be the last character of a literal, so C fails. new Integer(5) does not compile on Java 21, so D fails. Chapter 2 — Operators 必睇 參考書第 2 章 Operators，pp. 64–92：由 “Understanding Java Operators” 到 Exam Essentials。同第 4 章 “Calculating with Math APIs” pp. 202–203（ min 、 max 、 round 、 ceil 、 floor 、 pow ）。 唔使睇 bitwise operators（p. 86。筆記 “Shifts” 一段就夠）、 BigInteger （p. 204）、第 4 章其餘部分、Review Questions（p. 93 起）。 Friday is this chapter through the operator traps, then the fifteen expressions. Skip Math until Saturday. The shift section is part of Friday only after the fifteen expressions are done; Chapter 2 question Q10 uses one shift. Saturday part 1 is the Math section, the Math lab, and Chapter 2 questions Q7 and Q8. What you must know The exam asks you to evaluate an expression by hand. Precedence decides what happens first. When two operators share a precedence, most of them associate left to right. Assignment and the ternary operator associate right to left. Precedence, highest first Postfix x++ x-- Prefix ++x --x + - ! Cast (int) * / % + - (and string concatenation, which is the same + ) Shifts << >> >>> Relational < > <= >= instanceof Equality == != & ^ | && || Ternary ?: Assignment = += -= *= and the rest instanceof returns in week 4 with classes. For this week, remember that it sits with the relational operators. Numeric promotion Smaller integer types are promoted to int before arithmetic. byte , short , and char arithmetic produces an int . byte a = 1; byte b = 2; byte c = a + b; // does not compile: a + b is an int byte d = 1 + 2; // compiles: 1 + 2 is a constant that fits in a byte Binary promotion for an operator with two numbers: if either side is double , the other becomes double else if either is float , the other becomes float else if either is long , the other becomes long else both become int A widening assignment is free: int to long , float to double . A narrowing assignment needs a cast: long to int , double to int . The cast truncates toward zero. (int) 9.9 is 9 . (int) -9.9 is -9 . A boolean cannot be cast to a number, and a number cannot be cast to a boolean . The operators that generate traps Integer division truncates toward zero. 5 / 2 is 2 . 5 % 2 is 1 . The sign of % follows the dividend: -5 % 2 is -1 . Dividing an integer by zero throws ArithmeticException . Dividing a floating-point value by zero does not: 1.0 / 0.0 is Infinity , and 0.0 / 0.0 is NaN . + is left to right. Once a String appears, the rest is concatenation. System.out.println(1 + 2 + \"3\" + 4 + 5); // 3345 System.out.println(\"3\" + 1 + 2); // 312 && and || stop early. & and | on booleans always evaluate both sides. On numbers, & | ^ are bitwise. int x = 0; boolean left = false && ++x > 0; // x stays 0 boolean both = false & ++x > 0; // x becomes 1 ^ on booleans is exclusive or: true ^ false is true , true ^ true is false . A compound assignment includes a hidden cast, and the right-hand side is evaluated as a whole: byte b = 1; b += 1; // compiles: b = (byte) (b + 1) b = b + 1; // does not compile int n = 5; n *= 2 + 3; // n = 5 * (2 + 3) = 25 x++ returns the old value, then adds one. ++x adds one, then returns the new value. int x = 1; int y = x++ + ++x; // 1 + 3, and x is now 3 The ternary operator associates to the right. Both branches must end up as one type. flag ? 1 : 2.0 has type double . Assigning that to an int does not compile. An assignment is an expression. if (ready = true) assigns true and then tests it, when ready is a boolean . if (n = 5) does not compile when n is an int , because the value of the assignment is an int , and if requires a boolean . Shifts Read this on Friday after the fifteen expressions. << shifts left. >> shifts right and keeps the sign. >>> shifts right and fills with zeros. For an int , the distance is taken mod 32. 1 << 32 is 1 , because the distance is 0. 1 << 31 is Integer.MIN_VALUE . Friday task — fifteen expressions Write the value, and the type when it matters, before you compile anything. Then type each line into main and run it. Keep every miss. 1 + 2 * 3 (1 + 2) * 3 5 / 2 5 / 2.0 (int) (5 / 2.0) (int) 5 / 2.0 (double) (5 / 2) (double) 5 / 2 10 % 3 -5 % 2 (int) 9.9 (int) -9.9 1 + 2 + \"3\" + 4 true || false && false (byte) 200 The answer key is after the Chapter 2 answers. Do not scroll to it yet. Friday’s question time, after the expressions: Chapter 2 questions Q1–Q6, Q9, and Q10. Saturday part 1 — Math Call each method below by typing the lab. Math.round on a double returns a long . That is the checklist item. Call Returns Rule Math.abs same type as the argument Math.abs(Integer.MIN_VALUE) stays negative, because the positive value does not fit in an int Math.min / Math.max the type of the overload you called Math.round(double) long ties go toward positive infinity Math.round(float) int same tie rule Math.ceil double toward positive infinity Math.floor double toward negative infinity Math.pow double Math.random double from 0.0 inclusive to 1.0 exclusive Math.round(2.5) is 3 . Math.round(-1.5) is -1 , because the tie rounds toward positive infinity. Math.ceil(-1.1) is -1.0 . Math.floor(-1.1) is -2.0 . int i = Math.round(2.5); does not compile, because that overload returns a long . int i = Math.round(2.5f); compiles. Type this class and run it. Leave the commented line commented, then uncomment it once and confirm the compile error. public class MathCalls { public static void main(String[] args) { System.out.println(Math.abs(-7)); System.out.println(Math.min(3, 8)); System.out.println(Math.max(3, 8)); long rounded = Math.round(2.5); System.out.println(rounded); System.out.println(Math.ceil(1.2)); System.out.println(Math.floor(1.2)); System.out.println(Math.pow(2, 3)); // int bad = Math.round(2.5); } } Saturday’s question time for this half: Chapter 2 questions Q7 and Q8. Then go to Chapter 3 for if / else and both kinds of switch . Chapter 2 questions Q1–Q6, Q9, and Q10 are Friday. Q7 and Q8 are Saturday. Q1. What is the output? public class Q1 { public static void main(String[] args) { System.out.println(1 + 2 + \"3\" + 4 + 5); } } A 15 B 3345 C 12345 D The code does not compile 揭曉答案 答案：B。 1 + 2 happens first and is 3 . Then \"3\" turns the expression into a String , so 4 and 5 are concatenated. The print is 3345 . Q2. Which lines compile? (Choose all that apply.) byte a = 1; byte b = 2; byte c = a + b; byte d = 1 + 2; byte e = (byte) (a + b); int f = a + b; A The declaration of a B The declaration of c C The declaration of d D The declaration of e E The declaration of f 揭曉答案 答案：A、C、D、E。 a is a constant that fits. a + b has type int , so storing it in a byte needs a cast. 1 + 2 is a constant expression whose result fits in a byte . The explicit cast compiles. Assigning the int sum to an int compiles. Q3. What is the output? public class Q3 { public static void main(String[] args) { int x = 1; int y = x++ + ++x; System.out.print(x); System.out.print(y); } } A 23 B 33 C 34 D 24 揭曉答案 答案：C。 x starts at 1. x++ contributes 1 and leaves x at 2. ++x raises x to 3 and contributes 3. y is 4. The print is x then y : 34 . Q4. What is the output? public class Q4 { public static void main(String[] args) { int x = 0; if (false && ++x == 1) {} System.out.print(x); if (false & ++x == 1) {} System.out.print(x); } } A 00 B 01 C 11 D An ArithmeticException is thrown 揭曉答案 答案：B。 && does not evaluate ++x , so the first print is 0 . & on a boolean evaluates both sides, so x becomes 1 and the second print is 1 . Q5. What is the result? public class Q5 { public static void main(String[] args) { byte b = 1; b += 1; System.out.println(b); } } A 1 B 2 C The code does not compile D A NullPointerException is thrown 揭曉答案 答案：B。 b += 1 is b = (byte) (b + 1) . It compiles and prints 2 . The line b = b + 1 would not compile. That line is not in this question. Q6. What is the output? public class Q6 { public static void main(String[] args) { int n = 5; n *= 2 + 3; System.out.println(n); } } A 13 B 25 C 10 D The code does not compile 揭曉答案 答案：B。 n *= 2 + 3 is n = n * (2 + 3) . 5 * 5 is 25 . Q7. What is the output? public class Q7 { public static void main(String[] args) { System.out.print(Math.round(2.5)); System.out.print(\" \"); System.out.print(Math.round(-1.5)); System.out.print(\" \"); System.out.print(Math.floor(-1.1)); } } A 2 -1 -1.0 B 3 -1 -2.0 C 3 -2 -1.0 D 2 -2 -2.0 揭曉答案 答案：B。 A tie rounds toward positive infinity, so 2.5 rounds to 3 and -1.5 rounds to -1 . floor goes toward negative infinity, so -1.1 becomes -2.0 . Q8. Which of the following compile? (Choose all that apply.) int a = Math.round(2.5); int b = Math.round(2.5f); long c = Math.round(2.5); int d = (int) Math.ceil(1.2); int e = Math.abs(Integer.MIN_VALUE); boolean f = (boolean) 1; A a B b C c D d E The line that calls Math.abs compiles, and the value is negative F f 揭曉答案 答案：B、C、D、E。 Math.round(double) returns a long , so A does not compile and C does. Math.round(float) returns an int . ceil returns a double ; the cast makes an int of 2 . Math.abs(Integer.MIN_VALUE) compiles and returns Integer.MIN_VALUE , which is negative. A boolean cast of 1 does not compile. Q9. What is the output? public class Q9 { public static void main(String[] args) { int x = 10; int y = 20; System.out.println(x > 5 ? y > 15 ? 1 : 2 : 3); } } A 1 B 2 C 3 D The code does not compile 揭曉答案 答案：A。 ?: associates to the right, so this is x > 5 ? (y > 15 ? 1 : 2) : 3 . x > 5 is true and y > 15 is true, so the result is 1 . Q10. What is the result? public class Q10 { public static void main(String[] args) { System.out.println(1 << 32); } } A 0 B 1 C 32 D The code does not compile 揭曉答案 答案：B。 An int shift distance is taken mod 32. 32 % 32 is 0 , so this is 1 << 0 , which is 1 . Friday expression answers"}, {"id": "Week-01-glossary.html|term-main", "k": "c", "w": "第 1 週", "c": "詞彙", "h": "Week-01-glossary.html", "l": "第 1 週 · 詞彙 · main"}, {"id": "Week-01-glossary.html|term-compile", "k": "c", "w": "第 1 週", "c": "詞彙", "h": "Week-01-glossary.html", "l": "第 1 週 · 詞彙 · Compile"}, {"id": "Week-01-glossary.html|term-local-variable", "k": "c", "w": "第 1 週", "c": "詞彙", "h": "Week-01-glossary.html", "l": "第 1 週 · 詞彙 · Local variable"}, {"id": "Week-01-glossary.html|term-primitive", "k": "c", "w": "第 1 週", "c": "詞彙", "h": "Week-01-glossary.html", "l": "第 1 週 · 詞彙 · Primitive"}, {"id": "Week-01-glossary.html|term-byte-range", "k": "c", "w": "第 1 週", "c": "詞彙", "h": "Week-01-glossary.html", "l": "第 1 週 · 詞彙 · byte range"}, {"id": "Week-01-glossary.html|term-char", "k": "c", "w": "第 1 週", "c": "詞彙", "h": "Week-01-glossary.html", "l": "第 1 週 · 詞彙 · char"}, {"id": "Week-01-glossary.html|term-field-default", "k": "c", "w": "第 1 週", "c"
